positive_mo_mean_halo:
    - runfile: scripts/track_cliq_failure.py
      args:
        - [data/hllhc_b1_v19_round_imo300_no_errors.json]
        - [data/CollDB_HL_tight_b1_15.data]
        - [1]
        - [0]
        - [data/mqxfb_r5_multipole_coeff.csv]
        - [Q2R5, Q2R1, Q1R5, Q1R1, Q3R5, Q3R1, Q2L5, Q2L1, Q1L5, Q1L1, Q3L5, Q3L1]
        - [2D, 4D]
        - [1.3]
        - [0.9]
        - [1000000]
        - [10]
      num_jobs: 1

