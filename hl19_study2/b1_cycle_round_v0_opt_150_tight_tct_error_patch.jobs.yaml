      args:
        - [data/hllhc_b1_vhl19p4_cycle_round_v0_opt_150_thin.json]
        - [data/CollDB_tight_150mm_tct_error.yaml]
        - [1]
        - [0]
        - [data/hllhc_b1_vhl19p4_cycle_round_v0_opt_150_thin__init_dist_mean_2D_tight_nemitt_design_imo_-300.pkl]
        - [data/mqxfb_r5_multipole_coeff.csv]
        - [Q2L5b, Q1R1a, Q3R1b]
        - [mean]
        - [2D]
        - [-300]
        - [60]
        - [9]
      num_jobs: 1

